spring.application.name=demo-service1

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/DemoService1DB
spring.datasource.username=postgres
spring.datasource.password=Anadi@1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=YourSecretKeyHereMustBeLongEnoughForHS512AlgorithmAtLeast64Characters123456

#Eureka configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Caching
#spring.cache.type=caffeine
#spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10ms

# Resilence4j Circuit Breaker
resilience4j.circuitbreaker.instances.demoService2.register-health-indicator=true
resilience4j.circuitbreaker.instances.demoService2.sliding-window-size=10
resilience4j.circuitbreaker.instances.demoService2.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.demoService2.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.demoService2.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.demoService2.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.demoService2.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.demoService2.slow-call-rate-threshold=100
resilience4j.circuitbreaker.instances.demoService2.slow-call-duration-threshold=2s

# resilience4j retry
resilience4j.retry.instances.demoService2.max-attempts=3
resilience4j.retry.instances.demoService2.wait-duration=1s
resilience4j.retry.instances.demoService2.enable-exponential-backoff=true
resilience4j.retry.instances.demoService2.exponential-backoff-multiplier=2

# Resilience4j - TimeLimiter
resilience4j.timelimiter.instances.demoService2.timeout-duration=5s
resilience4j.timelimiter.instances.demoService2.cancel-running-future=true

#logging
logging.level.root=INFO
logging.level.com.microservice_demo.demo_service_1=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.cache=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.feign=DEBUG

#log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

#actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.metrics.export.prometheus.enabled=true

# Feign
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000
feign.client.config.default.logger-level=full
feign.circuitbreaker.enabled=true
feign.client.config.demo-service2.connect-timeout=3000
feign.client.config.demo-service2.read-timeout=8000

server.port=8085
# JWT Configuration (CRITICAL - must match auth-service)
jwt.expiration=86400000

# Redis Configuration (if using Redis cache)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Logging Configuration - CRITICAL FOR DEBUGGING
logging.level.com.microservice_demo.demo_service_1.security=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO

# Optional: More verbose debugging (uncomment if needed)
# logging.level.org.springframework.security=DEBUG
# logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Actuator Configuration

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Resilience4j Circuit Breaker (for Feign clients)
resilience4j.circuitbreaker.instances.demoService2.failureRateThreshold=50
resilience4j.circuitbreaker.instances.demoService2.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.demoService2.slidingWindowSize=10

# Resilience4j Retry
resilience4j.retry.instances.demoService2.maxAttempts=3
resilience4j.retry.instances.demoService2.waitDuration=1000